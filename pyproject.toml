[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sravamflow"
version = "0.1.0"
description = "Visual underwriting HTTP service"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "redis",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
